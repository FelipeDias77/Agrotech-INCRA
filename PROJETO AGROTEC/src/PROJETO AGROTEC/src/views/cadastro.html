<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTech - Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/assets/css/cadastro.css">
</head>
<body>
    <button onclick="history.back()" class="back-button">Voltar</button>

    <div class="container">
        <form class="formulario" action="cadastro.php" method="POST">
            <h2>Crie sua Conta AgroTech</h2>

            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>

            <div class="campo">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>

            <div class="campo">
                <label for="genero">Gênero:</label>
                <select id="genero" name="genero" required>
                    <option value="" disabled selected>Selecione seu gênero</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="campo">
                <label for="tipoUsuario">Tipo de Usuário:</label>
                <div class="opcoes">
                    <label for="comprador">
                        <input type="radio" id="comprador" name="tipoUsuario" value="comprador" required>
                        Comprador
                    </label>
                    <label for="produtor">
                        <input type="radio" id="produtor" name="tipoUsuario" value="produtor" required>
                        Produtor
                    </label>
                </div>
            </div>

            <div class="containex">
                <button type="submit" class="btn-primary">Criar Conta</button>
            </div>
            
            <h3 class="separator">ou</h3>
            
            <div class="containex">
                <a href="https://acesso.gov.br/" class="btn-govbr" target="_blank">Entrar Pelo GOV.BR</a>
            </div>
        </form>
    </div>

</body>
</html>
