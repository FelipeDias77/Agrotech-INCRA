<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCRA - Login</title>
    <link rel="stylesheet" href="../public/assets/css/entrinha.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="logo">
                <img src="../public/assets/img/logo/incra-logo2.png" alt="INCRA">
            </div>
        </div>
        <div class="right">
            
        <form class="login-form" method="POST" action=""> 
    
        <label for="cpf">N° CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required />
    
        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" placeholder="Digite sua senha" required />
    
    <div class="containex">
        <button type="submit" class="btn-primary-submit">
            ENTRAR
        </button>
    </div>
    
    <div class="containex">
        <a href="https://acesso.gov.br/" class="btn-link-action">
            ENTRAR PELO GOV.BR
        </a>
    </div>
    
    <a href="redefinir-senha.php" class="link" id="forgotPassword">Esqueceu a senha?</a>
    </form>
    </div>
    </div>

    <script src="../public/assets/js/javinha.js"></script>

</body>
</html>
