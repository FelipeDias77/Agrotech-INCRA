<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Nova Senha - AgroTech</title>
    <link rel="stylesheet" href="../public/assets/css/stylee.css" />
</head>
<body>
    
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="../public/assets/img/logo/incra.png" alt="Logo AgroTech" class="logo-img">
            </a>

            <div class="search-bar">
                <input type="text" placeholder="Pesquisar na AgroTech...">
                <button>Pesquisar</button>
            </div>
            
            <div class="user-access">
                <a href="entrar.html" class="action-btn">
                    Entrar
                </a>
                <a href="login.html" class="action-btn action-btn-alt">
                    Criar Conta
                </a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="password-reset-box">
            <h2>Insira sua nova senha</h2>
            
            <form action="redefinir.php" method="POST">
                
                <div class="campo">
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" name="nova-senha" placeholder="Mínimo 8 caracteres" class="input-field" required />
                </div>
                
                <div class="campo">
                    <label for="confirmar-senha">Confirme a Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a senha novamente" class="input-field" required />
                </div>
                
                <button type="submit" class="btn-primary">Confirmar Nova Senha</button>
            </form>
            
            <p style="margin-top: 15px;">
                <a href="index.html" class="link-voltar">Voltar à Página Inicial</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <p>gov.br | Agricultura Familiar | &copy; 2025 AgroTech</p>
    </footer>
</body>
</html>
